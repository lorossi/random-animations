name: Build and Deploy on Website
on:
  push:
    paths:
      - "animations/**"
      - "scripts/ci/**"
      - "homepage/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_ARTIFACTS_PATH: dest
  SITE_ARTIFACT_NAME: website-files
  WORKERS: 8

jobs:
  check-animations:
    runs-on: ubuntu-latest

    steps:
      - &checkout_step
        name: Checkout repository
        uses: actions/checkout@v5
      - &setup_uv_step
        name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - &install_dependencies_step
        name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Run animations check
        run: uv run --no-sync ./scripts/ci/check_animations.py

  build:
    runs-on: ubuntu-latest
    needs: check-animations
    steps:
      - *checkout_step
      - *setup_uv_step
      - *install_dependencies_step

      - name: Build website
        run: uv run --no-sync ./scripts/ci/build_website.py --destination ${{ env.SITE_ARTIFACTS_PATH }} --randomize --seed 875492

      - name: Upload static files as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: ${{ env.SITE_ARTIFACTS_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: website-secrets
    steps:
      - *checkout_step
      - *setup_uv_step
      - *install_dependencies_step

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: ${{ env.SITE_ARTIFACTS_PATH }}

      - name: Deploy to website
        run: |
          uv run --no-sync scripts/ci/publish_website.py \
          --source ${{ env.SITE_ARTIFACTS_PATH }} \
          --destination public_html/random-animations/ \
          --host lorenzoros.si \
          --user lorenz66 \
          --ssh-key "${{ secrets.SSH_PRIVATE_KEY }}" \
          --ssh-pwd "${{ secrets.SSH_KEY_PASSWORD }}" \
          --workers ${{ env.WORKERS }}