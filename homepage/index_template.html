<!doctype html>
<!-- Inspiration: https://www.tylerxhobbs.com/ -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>random animations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A collection of random generative animations by Lorenzo Rossi" />
    <meta name="author" content="Lorenzo Rossi" />
    <link rel="canonical" href="{{ site_url }}" />
    <link rel="icon" href="favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="random animations" />
    <meta property="og:description" content="A collection of random generative animations by Lorenzo Rossi" />
    <meta property="og:url" content="{{ site_url }}" />
    <meta property="og:image" content="{{ site_url }}assets/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" href="css/fonts/Raleway.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/vars.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/filter.js"></script>
  </head>

  <body>
    <div class="page">
      <header class="top">
        <h1><a href="{{ site_url }}">random animations</a></h1>
        <nav aria-label="Elsewhere">
          <a href="https://lorenzoros.si">Lorenzo Rossi</a>
          <a href="https://www.instagram.com/lorossi97/">Instagram</a>
          <a href="https://github.com/lorossi/random-animations">Source</a>
        </nav>
      </header>

      <div class="toolbar" role="search">
        <label class="search" id="search" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <span class="sr-only">Filter animations by title</span>
          <input id="filter" type="search" placeholder="Filter by title" />
        </label>
        <span id="count" aria-live="polite">{{ animations|length }} animations</span>
      </div>

      <main>
        <div class="content">
          {%- for animation in animations %}
          <a class="animation" href="{{ animation.path }}/" data-title="{{ animation.title|lower }}" style="animation-delay: {{ animation.delay }}s">
            <div class="frame">
              <img class="preview" src="{{ animation.preview }}" alt="Preview of the {{ animation.title }} animation" width="500" height="500" decoding="async" {% if loop.index <= 4 %}fetchpriority="high"{% else %}loading="lazy"{% endif %} />
              <span class="open" aria-hidden="true">Open <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
            </div>
            <div class="caption">
              <span class="title">{{ animation.title }}</span>
              <span class="num">{{ "%02d"|format(loop.index) }}</span>
            </div>
          </a>
          {%- endfor %}
        </div>
        <p id="empty" class="empty" hidden>No animation matches your filter.</p>
      </main>

      <footer class="bottom">
        <span>Code released under the <a href="https://github.com/lorossi/random-animations/blob/main/LICENSE">MIT license</a>.</span>
        <span>Made by Lorenzo Rossi</span>
      </footer>
    </div>
  </body>
</html>
